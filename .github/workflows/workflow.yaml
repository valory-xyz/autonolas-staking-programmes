name: Workflow
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    continue-on-error: False
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4

      # Install modules
      - name: Install modules
        run: yarn install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to a semver release, not `nightly`. Tracking `nightly` made CI depend on an
          # unvetted daily build: foundryup resolves a nightly tag whose linux-amd64 asset may
          # never have been published (HTTP 404), and every job in the repo then fails on an
          # upstream change with no commit of ours involved. A floating toolchain also means the
          # runner that validates the contracts can change silently between a review and a merge,
          # which this repo already avoids for solc.
          # Bump deliberately, as a reviewable one-line change.
          version: v1.7.1

      # Run linters
      - name: Run ESLint
        run: ./node_modules/.bin/eslint . --ext .js,.jsx,.ts,.tsx
      - name: Run solhint
        run: ./node_modules/.bin/solhint contracts/p1/*.sol contracts/test/*.sol

      # Compile the code and run tests and deploy script(s)
      - name: Compile the code
        run: ./node_modules/.bin/hardhat compile
      - name: Run tests
        run: ./node_modules/.bin/hardhat test

      # Run hardhat coverage and upload codecov report
      - name: Solidity coverage summary
        run: ./node_modules/.bin/hardhat coverage

      # Compile the code and run foundry tests
      - name: Run foundry tests
        run: forge test --hh -vvv

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs failed, were cancelled, or skipped"
            exit 1
          fi
